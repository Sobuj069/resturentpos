<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4A0812"/>
      <stop offset="70%" stop-color="#2B050B"/>
      <stop offset="100%" stop-color="#180205"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1C5"/>
      <stop offset="30%" stop-color="#E5B842"/>
      <stop offset="70%" stop-color="#B88A22"/>
      <stop offset="100%" stop-color="#845E10"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="100%" stop-color="#C99827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Inner Decorative Rings -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- Stars / Embellishments -->
  <g fill="url(#goldGrad)">
    <polygon points="256,44 261,56 274,56 263,64 267,76 256,69 245,76 249,64 238,56 251,56" transform="scale(0.8) translate(64, 10)"/>
    <polygon points="120,256 123,263 131,263 125,268 127,275 120,271 113,275 115,268 109,263 117,263"/>
    <polygon points="392,256 395,263 403,263 397,268 399,275 392,271 385,275 387,268 381,263 389,263"/>
  </g>

  <!-- Crown on Top -->
  <g transform="translate(196, 88) scale(0.6)" fill="url(#goldGrad)" filter="url(#glow)">
    <path d="M100 10 L140 70 L170 30 L200 70 L240 10 L230 90 L110 90 Z"/>
    <circle cx="100" cy="10" r="8"/>
    <circle cx="170" cy="30" r="7"/>
    <circle cx="240" cy="10" r="8"/>
  </g>

  <!-- Crossed Fork & Spoon / Knife -->
  <g transform="translate(256, 250)" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Fork (Left Diagonal) -->
    <g transform="rotate(-45)">
      <line x1="0" y1="-90" x2="0" y2="100"/>
      <!-- Fork Prongs -->
      <path d="M-18 -90 C-18 -60 18 -60 18 -90" fill="none" stroke-width="8"/>
      <line x1="-18" y1="-105" x2="-18" y2="-90" stroke-width="7"/>
      <line x1="-6" y1="-110" x2="-6" y2="-90" stroke-width="7"/>
      <line x1="6" y1="-110" x2="6" y2="-90" stroke-width="7"/>
      <line x1="18" y1="-105" x2="18" y2="-90" stroke-width="7"/>
    </g>
    <!-- Spoon (Right Diagonal) -->
    <g transform="rotate(45)">
      <line x1="0" y1="-70" x2="0" y2="100"/>
      <ellipse cx="0" cy="-90" rx="24" ry="34" fill="url(#goldGrad)" stroke="none"/>
    </g>
  </g>

  <!-- Chef Hat Silhouette / Accent in Center -->
  <g transform="translate(256, 210) scale(0.95)" filter="url(#glow)">
    <path d="M-40 0 C-60 -30 -30 -60 0 -45 C30 -60 60 -30 40 0 Z" fill="url(#goldLight)"/>
    <rect x="-32" y="0" width="64" height="12" rx="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <g text-anchor="middle" filter="url(#glow)">
    <!-- Main Title -->
    <text x="256" y="380" font-family="'Inter', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="url(#goldLight)">SULTAN'S DINE</text>
    <!-- Subtitle -->
    <text x="256" y="412" font-family="'Inter', sans-serif" font-size="15" font-weight="800" letter-spacing="6" fill="#FFF1C5" opacity="0.9">AUTHENTIC CUISINE</text>
    <!-- ESTD -->
    <text x="256" y="440" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="url(#goldGrad)">• ESTD 2026 •</text>
  </g>
</svg>
